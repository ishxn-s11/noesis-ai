[project]
name = "noesis-ai-backend"
version = "0.1.0"
description = "NOESIS AI — multi-agent astrophysics research platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6", "uvicorn==0.34.0", "sse-starlette==2.2.1",
    "python-multipart==0.0.20", "SQLAlchemy==2.0.36", "alembic==1.14.0",
    "psycopg[binary]==3.2.3", "pgvector==0.3.6", "redis==8.1.0",
    "FalkorDB==1.8.0", "PyJWT==2.10.1", "pydantic==2.10.4",
    "pydantic-settings==2.7.0", "email-validator==2.2.0",
    "numpy==2.2.1", "scipy==1.15.0", "sympy==1.13.1", "astropy==7.0.0",
    "matplotlib==3.10.0", "rebound==5.2.2", "emcee==3.1.6", "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
